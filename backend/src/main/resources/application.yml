server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: mtc-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mtc}
    username: ${SPRING_DATASOURCE_USERNAME:mtc}
    password: ${SPRING_DATASOURCE_PASSWORD:mtc_password_change_me}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true
    serialization:
      write-dates-as-timestamps: false
    date-format: yyyy-MM-dd'T'HH:mm:ssXXX
    time-zone: Asia/Shanghai

  mvc:
    throw-exception-if-no-handler-found: true

  web:
    resources:
      add-mappings: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

mtc:
  jwt:
    secret: ${MTC_JWT_SECRET:change_this_to_a_long_random_string_at_least_32_chars_for_dev}
    expire-seconds: ${MTC_JWT_EXPIRE_SECONDS:7200}
  ai:
    base-url: ${MTC_AI_BASE_URL:http://localhost:8000}
    connect-timeout-ms: 3000
    read-timeout-ms: 60000
  demo:
    enabled: ${MTC_DEMO_ENABLED:false}
    username: ${MTC_DEMO_USERNAME:admin}
    password: ${MTC_DEMO_PASSWORD:admin123}

logging:
  level:
    com.mtc: INFO
    org.springframework.security: INFO
